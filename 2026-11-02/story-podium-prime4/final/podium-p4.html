<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="da.css"><script src="kit.js"></script>
<style>
.bgl{position:absolute;inset:0;background:

 linear-gradient(140deg,transparent 78%,rgba(255,255,255,.3) 78.2%,transparent 78.6%)}

.row:nth-last-child(2){border-bottom:none}

.pt{margin-left:auto;font-weight:800;font-size:56px;color:var(--mag);white-space:nowrap}
.pt small{font-size:36px}
.cm{font-family:C;font-weight:700;font-size:40px;line-height:1.15;margin-top:10px}
.ft{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-family:H;font-size:30px;opacity:.6}
