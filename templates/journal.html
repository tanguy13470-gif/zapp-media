<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="da.css"><script src="kit.js"></script>
<style>
.lined{background-color:var(--bg);background-image:linear-gradient(90deg,transparent 118px,rgba(232,120,160,.35) 118px,rgba(232,120,160,.35) 121px,transparent 121px),repeating-linear-gradient(transparent 0 62px,rgba(120,150,220,.22) 62px 64px)}
.grid{background-color:var(--bg);background-image:linear-gradient(rgba(150,140,200,.16) 2px,transparent 2px),linear-gradient(90deg,rgba(150,140,200,.16) 2px,transparent 2px);background-size:54px 54px}
.holes{position:absolute;left:34px;top:0;bottom:0;width:40px;display:flex;flex-direction:column;justify-content:space-around;padding:60px 0}
.holes i{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:inset 0 3px 4px rgba(0,0,0,.12)}
.cv{font-family:C;font-weight:700}
.postit{position:absolute;background:#FFF3A6;padding:44px 46px 50px;box-shadow:0 14px 26px rgba(90,60,40,.18)}
.widget{background:#fff;border-radius:40px;padding:34px 36px;box-shadow:0 10px 26px rgba(110,80,140,.13);position:absolute}
.widget .big{font-weight:800;font-size:96px;line-height:1;letter-spacing:-2px}
.widget .lab{font-family:H;font-size:38px;margin-top:10px}
.chathead{position:absolute;left:58px;right:58px;top:150px;background:#fff;border-radius:30px;padding:20px 26px;display:flex;align-items:center;gap:18px;box-shadow:0 8px 24px rgba(80,100,160,.12)}
.av{width:64px;height:64px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:32px}
.notif{position:absolute;left:58px;right:58px;background:rgba(255,255,255,.92);border-radius:34px;padding:24px 28px;display:flex;align-items:center;gap:22px;box-shadow:0 8px 22px rgba(120,100,40,.12)}
.notif .ic{width:84px;height:84px;border-radius:22px;display:grid;place-items:center;font-size:48px}
.chk{display:flex;align-items:center;gap:24px;font-family:H;font-size:52px;height:96px}
.chk b{width:48px;height:48px;border:4px solid var(--ink);border-radius:10px;display:grid;place-items:center;font-family:P;font-size:34px;background:#fff}
.mod{position:absolute;right:52px;bottom:120px;transform:rotate(6deg);background:#fff;border:3px dashed var(--mag);color:var(--mag);font-family:H;font-size:28px;padding:6px 16px;border-radius:12px}
</style></head><body>
