<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="da.css"><script src="kit.js"></script>
<style>.grid{background-color:var(--bg);background-image:linear-gradient(rgba(150,140,200,.16) 2px,transparent 2px),linear-gradient(90deg,rgba(150,140,200,.16) 2px,transparent 2px);background-size:54px 54px}
.rays{background:repeating-conic-gradient(from 0deg at 50% 40%,rgba(255,255,255,.35) 0 8deg,transparent 8deg 16deg),var(--bg)}
.cv{font-family:C;font-weight:700}.postit{position:absolute;background:#FFF3A6;padding:40px 44px;box-shadow:0 14px 26px rgba(90,60,40,.18)}
.row{position:absolute;left:58px;right:58px;height:112px;background:#fff;border-radius:30px;display:flex;align-items:center;gap:22px;padding:0 34px;box-shadow:0 8px 20px rgba(120,60,90,.12)}
.row .rk{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:30px;background:#D4E5FF;flex:none}
.row .nm{font-weight:800;font-size:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
.row .pt{margin-left:auto;font-weight:800;font-size:46px;color:var(--mag)}
.row .mv{width:110px;text-align:right;font-family:H;font-size:38px}
.up{color:#2f8a5b}.dn{color:#c2410c}.eq{opacity:.5}
.card{position:absolute;left:70px;right:70px;background:#fff;border-radius:40px;padding:40px 46px;box-shadow:0 10px 26px rgba(120,60,90,.13);display:flex;align-items:center;gap:28px}
.card .ic{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:58px;flex:none;border:5px solid #fff;box-shadow:0 0 0 4px var(--ink)}
.card .n{font-weight:800;font-size:56px;line-height:1.05}.card .m{font-family:H;font-size:34px;opacity:.75;margin-top:6px}
.card .p{margin-left:auto;font-weight:800;font-size:64px;color:var(--mag);white-space:nowrap}.card .p small{font-size:30px}
.vs{position:absolute;left:470px;width:140px;height:140px;border-radius:50%;background:var(--mag);color:#fff;font-weight:800;font-size:56px;display:grid;place-items:center;border:8px solid #fff;z-index:2}
.foot{position:absolute;left:66px;top:1830px;font-family:H;font-size:28px;opacity:.6}
.chk{display:flex;align-items:center;gap:26px;margin-bottom:34px}.chk i{width:58px;height:58px;border:5px solid var(--ink);border-radius:10px;flex:none}
.chk b{font-weight:800;font-size:46px;display:block}.chk span{font-family:H;font-size:40px}
</style></head><body>
<div class="s tt rays" id="st1" style="--bg:var(--pink)"></div>
<div class="s tt grid" id="st2" style="--bg:var(--mint)"></div>
<div class="s tt grid" id="st3" style="--bg:var(--yellow)"></div>
<div class="s tt grid" id="st4" style="--bg:var(--lilac)"></div>
<div class="s tt rays" id="st5" style="--bg:var(--blue)"></div>
<div class="s tt grid" id="st6" style="--bg:var(--yellow)"></div>
<script>
const $=(id,h)=>document.getElementById(id).innerHTML=h;
const F=t=>`<div class="foot">${t} · appli de fans non officielle</div>`;
const mv=m=>m==='='?'<span class="mv eq">=</span>':m[0]==='+'?`<span class="mv up">↑ ${m.slice(1)}</span>`:`<span class="mv dn">↓ ${m.slice(1)}</span>`;
const medal=r=>r==1?'🥇':r==2?'🥈':r==3?'🥉':r+'e';
const rows=(L,top,h)=>L.map((r,i)=>`<div class="row" style="top:${top+i*(h||128)}px"><div class="rk" style="${r[0]<=3?'background:#FFF1B4;font-size:40px':''}">${medal(r[0])}</div><div class="nm">${r[1]}</div><div class="pt">${r[2]}</div>${mv(r[3])}</div>`).join('');

$('st1',PAPER+LOGO+STAR(880,190,140,14)+`<div style="position:absolute;left:58px;top:230px"><span class="tag">classement général · après le prime 4</span></div>
<h1 style="position:absolute;left:58px;top:310px;width:960px;font-size:96px;margin:0"><span class="hl">Le top 10</span><br><span class="hl">a bougé 🔥</span></h1>`+
rows([[1,'Laurine49',165,'='],[2,'cathycrtl',143,'-1'],[3,'melanielty',132,'='],[4,'Clararbt',120,'-1'],[5,'alexane1927',118,'+3'],[6,'Justine',115,'+3'],[7,'Maryne',111,'-2'],[8,'Lisouille',104,'+41'],[8,'Quef13',104,'-2'],[10,'Emeu',98,'+4']],560,118)+
`<div class="cv" style="position:absolute;left:70px;top:1890px;font-size:1px"></div>`+F('points cumulés, évolution depuis le prime 3'));

$('st2',PAPER+LOGO+STAR(860,170,140,-10)+SPARK(990,560,40)+`<div style="position:absolute;left:58px;top:230px"><span class="tag">classement des teams · prime 4</span></div>
<h1 style="position:absolute;left:58px;top:330px;width:960px;font-size:100px;margin:0"><span class="hl">Ça a bougé</span><br><span class="hl">chez les teams</span></h1>`+
rows([[1,'🎤 Les pros du micros',644,'='],[2,'💖 La star ac ‘ teams',404,'='],[3,'🔥 SENSAS TEAM',333,'='],[4,'⭐ YVORRA FAMILY',304,'+2'],[5,'⭐ L’académie',268,'='],[6,'⭐ LES LEMOINE',248,'+2'],[7,'🍀 LES BEST',238,'='],[8,'⭐ StarAcSnap',219,'-4']],600)+
`<div class="postit" style="left:150px;top:1630px;width:760px;padding:26px 36px;transform:rotate(-1.5deg)"><div class="hand" style="font-size:40px">et ça remonte derrière : Quart Sud ↑3, 🤩🤩🤩🤩 ↑5</div></div>`+F('points cumulés des membres'));

$('st3',PAPER+LOGO+STAR(860,60,170,14)+SPARK(70,1500,40)+`<div style="position:absolute;left:58px;top:250px"><span class="tag">les duels ⚔️</span></div>
<h1 style="position:absolute;left:58px;top:350px;width:960px;font-size:104px;margin:0"><span class="hl">Justine</span> <span class="hl">2 sur 2</span></h1>
<div class="cv" style="position:absolute;left:70px;top:520px;font-size:56px;transform:rotate(-2deg)">défiée deux fois au prime 4, deux victoires</div>
<div class="card" style="top:640px"><div class="ic" style="background:#FFD7E5">🏆</div><div><div class="n">Justine 38</div><div class="m">contre Quef13 · 29</div></div><div class="p">+5 <small>pts</small></div></div>
<div class="card" style="top:860px"><div class="ic" style="background:#FFD7E5">🏆</div><div><div class="n">Justine 38</div><div class="m">contre Marie885 · 31</div></div><div class="p">+5 <small>pts</small></div></div>
<div style="position:absolute;left:58px;top:1120px"><span class="tag">déjà lancés pour le prime 5</span></div>
<div class="card" style="top:1220px"><div class="ic" style="background:#D4E5FF">🚀</div><div><div class="n">Lisouille</div><div class="m">8e, défie Maryne (7e)</div></div><div class="p">⚔️</div></div>
<div class="card" style="top:1420px"><div class="ic" style="background:#D4E5FF">🚀</div><div><div class="n">Lisouille</div><div class="m">défie aussi Justine (6e)</div></div><div class="p">⚔️</div></div>
<div class="search" style="position:absolute;left:58px;right:58px;top:1660px">🔍 <span>qui va gagner ? <span class="q">pronos dans l'app</span></span></div>`+F('scores des duels sur le prime 4'));

$('st4',PAPER+LOGO+STAR(870,170,150,12)+SPARK(110,1150,38)+`<div style="position:absolute;left:58px;top:230px"><span class="tag">droit de duel · prime 5</span></div>
<h1 style="position:absolute;left:58px;top:330px;width:960px;font-size:96px;margin:0"><span class="hl">Ils ont gagné</span><br><span class="hl">le droit de défier</span></h1>
<div class="cv" style="position:absolute;left:70px;top:590px;font-size:54px;transform:rotate(-2deg)">les meilleurs du prime 4 ✨</div>`+
rows([[1,'Laurine49','71 pts','='],[2,'Lisouille','67 pts','='],[3,'Christelle','59 pts','=']],700).replace(/<span class="mv eq">=<\/span>/g,'')+
`<div class="cv" style="position:absolute;left:70px;top:1110px;font-size:54px;transform:rotate(-2deg)">les plus belles progressions 📈</div>`+
rows([[1,'Christelle','','='],[2,'Lisouille','','='],[3,'chloecorfmat','','=']],1220).replace(/<span class="mv eq">=<\/span>/g,'')+
`<div class="postit" style="left:170px;top:1640px;width:720px;padding:26px 36px;transform:rotate(1.5deg)"><div class="hand" style="font-size:40px">qui vont-ils défier ? réponse vendredi ⚔️</div></div>`+F('droits de duel attribués par l\'appli'));

$('st5',PAPER+LOGO+STAR(840,250,150,12)+SPARK(980,700,40)+`<div style="position:absolute;left:58px;top:250px"><span class="tag">la plus belle progression</span></div>
<h1 style="position:absolute;left:58px;top:350px;width:960px;font-size:118px;margin:0"><span class="hl">Lisouille 🚀</span></h1>
<div class="card" style="top:600px;justify-content:center;gap:50px"><div style="text-align:center"><div class="m">après le prime 3</div><div class="n" style="font-size:120px">49e</div></div><div style="font-size:90px">→</div><div style="text-align:center"><div class="m">après le prime 4</div><div class="n" style="font-size:120px;color:var(--mag)">8e</div></div></div>
<div class="postit" style="left:120px;top:960px;width:800px;transform:rotate(-1.5deg)"><div class="hand" style="font-size:40px;color:var(--mag)">sur le seul prime 4</div><div style="font-weight:800;font-size:76px;line-height:1.1">+67 pts</div><div class="hand" style="font-size:40px;margin-top:8px">les 3 nommés trouvés, 2e meilleur score du prime</div></div>
<div class="tape pk" style="left:440px;top:940px"></div>
<div class="bubble them" style="position:absolute;left:58px;top:1360px;width:860px;font-size:38px">Mention spéciale à chloecorfmat : de 112e à 59e, +53 places 👏</div>
<div class="bubble me" style="position:absolute;right:58px;top:1560px;width:600px;font-size:38px">la prochaine remontada, c'est toi ?</div>`+F('évolution depuis le prime 3'));

$('st6',PAPER+LOGO+STAR(860,170,150,12)+SPARK(110,1500,40)+`<div style="position:absolute;left:58px;top:230px"><span class="tag">⚠️ dates du prime 5</span></div>
<h1 style="position:absolute;left:58px;top:330px;width:960px;font-size:104px;margin:0"><span class="hl">Prime 5</span><br><span class="hl">vendredi 6/11</span></h1>
<div class="cv" style="position:absolute;left:70px;top:600px;font-size:58px;transform:rotate(-2deg)">pas samedi cette semaine, note bien 👇</div>
<div class="card" style="top:740px;display:block;padding:54px 54px 20px">
<div class="chk"><i></i><div><b>Nommés + top 3 des évals</b><span>avant mardi 3/11 · 18h30</span></div></div>
<div class="chk"><i></i><div><b>Battle</b><span>avant vendredi 6/11 · 22h30</span></div></div>
<div class="chk"><i></i><div><b>Éliminé·e</b><span>avant vendredi 6/11 · 23h30</span></div></div>
<div class="chk"><i></i><div><b>Prime 5 en direct</b><span>vendredi 6/11 · 21h</span></div></div></div>
<div class="search" style="position:absolute;left:58px;right:58px;top:1560px">🔍 <span>tes pronos <span class="q">lien en bio</span></span></div>`+F('heures de Paris'));
</script></body></html>
